name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, rocky9, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} parent and child
        working-directory: examples/local
        env:
          # Conn3x has no Rocky Linux 9 test image, so that one lives here.
          CONTAINERFILE: ${{ github.workspace }}/${{ matrix.distro == 'rocky9' && 'test/images' || 'conn3x/test/images' }}/${{ matrix.distro }}/Containerfile
          # The hosts are privileged, so Netdata's unit can set up its
          # mount namespace.
          PODMAN: sudo podman
        run: ./up.sh
      # The key is a shared secret, kept out of state, so the plan needs the
      # same one as the apply to find no changes, and the state check needs
      # it to look for.
      - name: Make a stream key
        run: |
          key=$(cat /proc/sys/kernel/random/uuid)
          echo "::add-mask::$key"
          echo "TF_VAR_stream_api_key=$key" >> "$GITHUB_ENV"
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The key reaches the hosts write-only, so state holds none of it, and
      # nothing Conn3x writes under .terraform does either.
      - name: Check the stream key stays out of state
        working-directory: examples/local
        run: |
          test -s terraform.tfstate || { echo "No terraform.tfstate to check." >&2; exit 1; }
          if grep -rqF --exclude-dir=modules -e "$TF_VAR_stream_api_key" terraform.tfstate .terraform/; then
            echo "The stream key is in terraform.tfstate or under .terraform/." >&2
            exit 1
          fi
      - name: Check the child collects and answers on loopback only, unclaimed and opted out
        run: |
          sudo podman exec -i circuit-netdata-child sh -eux <<'EOF'
          command -v curl >/dev/null || { apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -yq curl; } >/dev/null
          systemctl is-active netdata
          test -e /etc/netdata/.opt-out-from-anonymous-statistics
          for _ in $(seq 60); do curl -sf http://127.0.0.1:19999/api/v1/info > /tmp/info && break; sleep 1; done
          grep -Eq '"version": ?"v2.12.2"' /tmp/info
          grep -Eq '"agent-claimed": ?false' /tmp/info
          test ! -e /etc/netdata/claim.conf
          # A freshly started agent has no samples for a moment.
          for _ in $(seq 60); do
            curl -sf 'http://127.0.0.1:19999/api/v1/data?chart=system.cpu&after=-10&format=json' | grep -Eq '^ *\[[0-9]{10},' && exit 0
            sleep 1
          done
          exit 1
          EOF
      - name: Check the parent receives the child's stream, and can't reach the child's own port
        run: |
          sudo podman exec -i circuit-netdata-parent sh -eu <<'EOF'
          command -v curl >/dev/null || { apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -yq curl; } >/dev/null
          # The child listens on 127.0.0.1 only.
          if curl -s --max-time 5 -o /dev/null http://circuit-netdata-child:19999/; then exit 1; fi
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:19999/api/v2/nodes | grep -q '"nm":"circuit-netdata-child"' &&
              curl -sf 'http://127.0.0.1:19999/host/circuit-netdata-child/api/v1/data?chart=system.cpu&after=-10&format=json' | grep -Eq '^ *\[[0-9]{10},' &&
              exit 0
            sleep 1
          done
          exit 1
          EOF
      # Restarting the child's container boots systemd again, so this checks
      # Netdata is enabled and streams to the parent again from the config
      # on disk: the parent must get samples from after the restart.
      - name: Restart the child, then check the parent gets its stream again
        working-directory: examples/local
        run: |
          t=$(date +%s)
          sudo podman restart circuit-netdata-child
          sudo podman exec circuit-netdata-child timeout 60 systemctl is-system-running --wait || true
          sudo podman exec -i -e t="$t" circuit-netdata-parent sh -eu <<'EOF'
          for _ in $(seq 90); do
            newest=$(curl -sf 'http://127.0.0.1:19999/host/circuit-netdata-child/api/v1/data?chart=system.cpu&after=-10&format=json' | sed -nE 's/^ *\[([0-9]{10}), ?-?[0-9].*/\1/p' | sort -n | tail -n 1 || true)
            # Rows with values only, newer than the restart.
            [ "${newest:-0}" -gt "$t" ] && exit 0
            sleep 1
          done
          exit 1
          EOF
          conn3x plan -detailed-exitcode
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
